<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Isaure &amp; Brighton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Gilda+Display&family=Libre+Caslon+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="locked">

<section id="gate" class="gate">
  <div class="gate-deco" aria-hidden="true">
    <img class="g-dove" src="assets/draw-dove.png" alt="">
    <img class="g-vase" src="assets/draw-vase.png" alt="">
    <img class="g-candles" src="assets/draw-candles.png" alt="">
    <img class="g-glass-blue" src="assets/draw-glass-blue.png" alt="">
    <img class="g-tomatoes" src="assets/draw-tomatoes.png" alt="">
    <img class="g-grapes" src="assets/draw-grapes.png" alt="">
    <img class="g-glass-orange" src="assets/draw-glass-orange.png" alt="">
    <img class="g-pear" src="assets/draw-pear.png" alt="">
  </div>
  <div class="arch">
    <h1>Isaure<br>&amp; Brighton</h1>
    <p class="lead">Cette page est réservée à nos invités.<br>Entrez le mot de passe reçu avec votre invitation.</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe" required autofocus>
      <button type="submit">Entrer</button>
    </form>
    <p id="gate-msg" class="gate-msg" role="alert"></p>
  </div>
</section>

<div id="app" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
